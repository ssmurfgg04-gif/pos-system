# LedgerPOS CI — tests + Netlify deploy straight from this repo.
#
# Two jobs on every push to main (site-affecting paths only):
#   tests  — go vet + go test + frontend Vitest (the quality gate)
#   deploy — builds the exact site (landing, /demo/, /downloads/) with
#            scripts/netlify_build.py, deploys to Netlify production via
#            netlify-cli, then VERIFIES the live site serves this commit's
#            installers. A green run means the public site really updated.
#
# One-time setup (repo owner, ~2 minutes):
#   Netlify:  User settings → Applications → Personal access tokens →
#             New access token  → copy it (starts with nfp_)
#             Site configuration → Site details → Site ID (API ID)
#   GitHub:   this repo → Settings → Secrets and variables → Actions →
#             New repository secret ×2:
#               NETLIFY_AUTH_TOKEN = the nfp_ token
#               NETLIFY_SITE_ID    = the site's API ID
# Until those secrets exist the deploy step prints a reminder and the
# "verify live site" step FAILS LOUDLY (the public site would be stale —
# that is a real problem, not a green tick).
#
# Fallback with zero secrets: `python3 scripts/build_site.py`
# produces build/netlify-site/ — drag that folder onto
# app.netlify.com → Deploys.

name: LedgerPOS CI

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "scripts/netlify_build.py"
      - "scripts/assets/download-page.html"
      - "scripts/assets/icons/**"
      - "downloads/**"
      - "netlify.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  tests:
    name: go vet + go test + vitest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          # 24 matches the dev environment where the vitest suite is green
          # (jsdom+undici break on the runner's older 20.x image).
          node-version: "24"

      # main.go embeds all:frontend/dist — a placeholder keeps vet/test
      # compiling without a full frontend build (the deploy job builds it).
      - name: Placeholder embed dir
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: go vet
        run: go vet ./...

      - name: go test (sqlite default)
        run: go test ./... -count=1

      # The Postgres DDL is a hand-maintained copy of the sqlite schema —
      # server-mode deployments break when a column lands in one and not
      # the other. A real postgres runs the migration chain here; the test
      # skips locally when POSTGRES_TEST_DSN is unset.
      - name: go test (postgres dialect)
        env:
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/ledgerpos_test?sslmode=disable
        run: go test ./internal/database/ -run TestPostgresMigrations -count=1 -v


      - name: frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  deploy:
    name: build + deploy site + verify live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as the tests job + netlify.toml NODE_VERSION — one
          # node line everywhere (jsdom+undici need 24 for the vitest suite).
          node-version: "24"

      - name: Build the site (landing + demo + checksums; installers link to Releases)
        working-directory: frontend
        run: python3 ../scripts/netlify_build.py

      - name: Deploy to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are not set — the netlify-cli deploy is SKIPPED. If the Netlify GitHub integration is connected, it deploys instead; the next step checks the live site either way."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          npx --yes netlify-cli@latest deploy \
            --dir frontend/dist \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --prod \
            --message "repo deploy $GITHUB_SHA"

      # The step that keeps "green" honest: the live site must serve THIS
      # commit's checksums.txt. If it does not, the run fails with the exact
      # fix — no more silent staleness (site frozen at an old version while
      # every CI run shows green). Installers themselves live on GitHub
      # Releases; the repo ships links + manifest only.
      - name: Verify live site serves this commit
        run: |
          expected=$(awk '/ledgerpos-setup-windows-x64.exe/{print $1}' downloads/checksums.txt)
          live=$(curl -fsSL --max-time 30 https://awesomeposs.netlify.app/downloads/checksums.txt \
                 | awk '/ledgerpos-setup-windows-x64.exe/{print $1}' || true)
          if [ "$live" != "$expected" ]; then
            echo "::error::LIVE SITE IS STALE — awesomeposs.netlify.app does NOT serve this commit's installers."
            echo "  expected sha256: $expected"
            echo "  live sha256:     ${live:-<site unreachable>}"
            echo ""
            echo "Fix (pick one, ~2 minutes):"
            echo "  1. Set repo secrets NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID (see workflow header) and re-run this workflow."
            echo "  2. Netlify → Add new site → Import an existing project → pick this repo"
            echo "     (Base directory: frontend, Build command: python3 ../scripts/netlify_build.py, Publish directory: dist)."
            echo "  3. Drag the build/netlify-site/ folder onto app.netlify.com → Deploys."
            if [ "${{ steps.netlify.outputs.deployed }}" = "true" ]; then
              exit 1
            fi
            # No Netlify secrets → staleness is expected, but it must be
            # IMPOSSIBLE to miss: put it on the run summary page too, not
            # just a log warning nobody opens.
            echo "⚠️ **LIVE SITE STALE — awesomeposs.netlify.app still serves the OLD installers.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`NETLIFY_AUTH_TOKEN\`/\`NETLIFY_SITE_ID\` repo secrets and the Netlify GitHub integration is not connected, so every release skips the site deploy (site frozen at v1.3.6). Fix: set the two secrets (workflow header has the steps) or drag-drop the fresh \`ledgerpos-netlify-site\` bundle onto app.netlify.com → Deploys." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Verification skipped as non-fatal: no repo deploy ran this run (no NETLIFY secrets), so the staleness is expected until Netlify is connected. Once Netlify deploys from CI, mismatches fail the build again."
            exit 0
          fi
          echo "live site verified — downloads match this commit ($expected)"
