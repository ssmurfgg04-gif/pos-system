# LedgerPOS Android client — thin WebView terminal for a till server.
#
# ubuntu-latest runners ship the Android SDK, so this needs NO extra
# credentials for a debug-signed APK. A release keystore is optional: set
# these repo secrets to produce a release-signed APK (same discipline as
# OTA_SIGNING_KEY — generate ONCE with keytool, keep an offline copy in the
# owner's password manager, never re-create it: Android refuses updates
# across signatures):
#   ANDROID_KEYSTORE_BASE64  base64 of the .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: android

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the SPA (no demo backend in the APK)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Decode release keystore (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/ledgerpos.keystore

      - name: Stamp the APK version from the release manifest (single source of truth)
        run: |
          VER=$(python3 -c "import json; print(json.load(open('downloads/manifest.json'))['version'])")
          CODE=$(python3 -c "
          import json, re
          v = json.load(open('downloads/manifest.json'))['version']
          parts = re.findall(r'\d+', v)[:3]
          print(int(''.join(p.zfill(3) for p in parts)))")
          echo "APK version=$VER code=$CODE"
          sed -i "s/versionName \".*\"/versionName \"$VER\"/; s/versionCode [0-9]*/versionCode $CODE/" frontend/android/app/build.gradle

      - name: Gradle build
        working-directory: frontend/android
        env:
          LEDGERPOS_KEYSTORE: /tmp/ledgerpos.keystore
          LEDGERPOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEDGERPOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEDGERPOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f /tmp/ledgerpos.keystore ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Rename artifact
        id: art
        run: |
          VER=$(cat frontend/package.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          SRC=frontend/android/app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || SRC=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$SRC" "ledgerpos-android-${VER}.apk"
          echo "file=ledgerpos-android-${VER}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerpos-android-apk
          path: ${{ steps.art.outputs.file }}

      - name: Attach to the matching v* release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.art.outputs.file }}" --clobber
