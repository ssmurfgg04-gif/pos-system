# Netlify deployment — the LedgerPOS download site.
#
# What gets deployed (assembled by scripts/netlify_build.py):
#
#   /             the download landing page — Big-7 value props, one
#                 primary CTA that auto-detects the visitor's OS
#   /downloads/   checksums.txt + manifest.json (small text); the
#                 installer binaries live only on GitHub Releases and
#                 the landing page links straight at them
#   /demo/        the full POS as an in-browser demo (mock M-Pesa,
#                 seeded Nairobi print shop; log in with
#                 admin/admin123, cashier/cashier123, designer/designer123)
#
# The build is deterministic and offline-safe: everything it needs
# lives in this repository — no downloads from GitHub or any registry
# beyond npm ci itself.

[build]
  base = "frontend"
  command = "python3 ../scripts/netlify_build.py"
  publish = "dist"

[build.environment]
  # Aligned with CI's test + deploy jobs (node 24 is where the vitest
  # suite is green; jsdom+undici break on the older 20.x image).
  NODE_VERSION = "24"

# Browser-facing defense headers. The CSP mirrors the desktop app's
# (internal/router/router.go secureHeaders): scripts only from this origin
# plus the Paystack popup toolkit; the /portal/ page additionally talks to
# the fleet Supabase project. No inline handlers, no third-party packages.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.paystack.co; script-src-elem 'self' https://js.paystack.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.paystack.co https://*.supabase.co; frame-src https://js.paystack.co; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
